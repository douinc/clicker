name: PresentationRemote

options:
  bundleIdPrefix: com.dou
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  # ─────────────────────────────────────────────────────────────
  # Mac Menu Bar App
  # ─────────────────────────────────────────────────────────────
  PresentationRemoteMac:
    type: application
    platform: macOS
    sources:
      - path: MacApp
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleName: Presentation Remote
        LSUIElement: true
        NSBonjourServices:
          - _ppt-remote._tcp
          - _ppt-remote._udp
        NSLocalNetworkUsageDescription: "Presentation Remote needs local network access to connect with your iPhone for presentation control."
        NSAppleEventsUsageDescription: "Presentation Remote needs to send keystrokes to control your presentation software."
    entitlements:
      path: MacApp/PresentationRemoteMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.presentation-remote-mac
        PRODUCT_NAME: Presentation Remote
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacApp/PresentationRemoteMac.entitlements

  # ─────────────────────────────────────────────────────────────
  # iPhone App
  # ─────────────────────────────────────────────────────────────
  PresentationRemoteiOS:
    type: application
    platform: iOS
    sources:
      - path: iPhoneApp
        excludes:
          - "*.plist"
      - path: Shared
    info:
      path: iPhoneApp/Info.plist
      properties:
        CFBundleName: PPT Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBonjourServices:
          - _ppt-remote._tcp
          - _ppt-remote._udp
        NSLocalNetworkUsageDescription: "PPT Remote needs local network access to find and connect to your Mac for presentation control."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.presentation-remote-ios
        PRODUCT_NAME: PPT Remote
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD35YQ72U4
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE: false

schemes:
  PresentationRemoteMac:
    build:
      targets:
        PresentationRemoteMac: all
    run:
      config: Debug
    archive:
      config: Release

  PresentationRemoteiOS:
    build:
      targets:
        PresentationRemoteiOS: all
    run:
      config: Debug
    archive:
      config: Release
