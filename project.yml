name: Clicker

options:
  bundleIdPrefix: com.dou
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  # ─────────────────────────────────────────────────────────────
  # Mac Menu Bar App
  # ─────────────────────────────────────────────────────────────
  ClickerMac:
    type: application
    platform: macOS
    sources:
      - path: MacApp
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleName: ClickerRemoteReceiver
        LSUIElement: true
        NSBonjourServices:
          - _clickerremote._tcp
          - _clickerremote._udp
        NSLocalNetworkUsageDescription: "Clicker needs local network access to connect with your iPhone for presentation control."
        NSAppleEventsUsageDescription: "Clicker needs to send keystrokes to control your presentation software."
    entitlements:
      path: MacApp/ClickerMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.clicker-mac
        PRODUCT_NAME: ClickerRemoteReceiver
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacApp/ClickerMac.entitlements
        DEVELOPMENT_TEAM: HD35YQ72U4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required for notarization
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  # ─────────────────────────────────────────────────────────────
  # iPhone App
  # ─────────────────────────────────────────────────────────────
  ClickeriOS:
    type: application
    platform: iOS
    sources:
      - path: iPhoneApp
        excludes:
          - "*.plist"
          - "*.storekit"
      - path: Shared
    capabilities:
      In-App Purchase: {}
    info:
      path: iPhoneApp/Info.plist
      properties:
        CFBundleName: ClickerRemote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBonjourServices:
          - _clickerremote._tcp
          - _clickerremote._udp
        NSLocalNetworkUsageDescription: "Clicker needs local network access to find and connect to your Mac."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.clicker-ios
        PRODUCT_NAME: ClickerRemote
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD35YQ72U4
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClickerMac:
    build:
      targets:
        ClickerMac: all
    run:
      config: Debug
    archive:
      config: Release

  ClickeriOS:
    build:
      targets:
        ClickeriOS: all
    run:
      config: Debug
      storeKitConfiguration: iPhoneApp/Products.storekit
    archive:
      config: Release
